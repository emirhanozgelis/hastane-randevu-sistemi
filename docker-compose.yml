version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    container_name: hospital_postgres
    environment:
      POSTGRES_DB: HospitalDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hospital_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d HospitalDB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  hospital-api:
    build:
      context: .
      dockerfile: src/HospitalAppointment.API/Dockerfile
    container_name: hospital_api
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=HospitalDB;Username=postgres;Password=postgres
      - Jwt__Key=HospitalAppointmentSystemSecretKey2026MustBe32Chars!
      - Jwt__Issuer=HospitalAPI
      - Jwt__Audience=HospitalClient
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  hospital-web:
    build:
      context: .
      dockerfile: src/HospitalAppointment.Web/Dockerfile
    container_name: hospital_web
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=HospitalDB;Username=postgres;Password=postgres
      - Jwt__Key=HospitalAppointmentSystemSecretKey2026MustBe32Chars!
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hospital_pgdata:
